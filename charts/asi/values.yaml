nameOverride: ""
fullnameOverride: ""

secrets:
  # Deliberately not configurable. The Secret is always <fullname>-secrets,
  # because the Makefile derives the same name independently
  # (`SECRET_NAME ?= $(RELEASE)-secrets`) and every target that reads
  # credentials -- secrets-show, oper, irc, gateway, and the rotation counter
  # itself -- would silently read the wrong object if the two disagreed.

  # Rotation counter. Generated credentials are re-derived only when this
  # changes; a plain `helm upgrade` reads the live values back and preserves
  # them. `make secrets-rotate` bumps it and rolls both workloads.
  generation: 0

  # Length of each generated credential.
  lengths:
    ircServerPassword: 40
    ircOperPassword: 40
    openclawGatewayToken: 48

ergo:
  image:
    repository: ghcr.io/ergochat/ergo
    tag: stable
    pullPolicy: IfNotPresent

  # `network.name` and `server.name` in ircd.yaml.
  networkName: ASI
  serverName: irc.asi.internal

  # The plaintext listener is reachable from anywhere in the cluster, which the
  # upstream default deliberately is not -- openclaw runs in its own pod. Keep
  # it on the pod network; expose 6697 if you need a listener off-cluster.
  plainPort: 6667
  tlsPort: 6697

  service:
    type: ClusterIP

  persistence:
    # Holds ircd.db (account/channel registrations) and the self-signed keypair.
    size: 1Gi
    storageClass: ""

  resources: {}

  # Extra ERGO__* config overrides, applied on top of the image's default.yaml.
  # Values are parsed as YAML, so strings generally need no quoting.
  extraEnv: {}

openclaw:
  image:
    # Built from images/openclaw/Dockerfile -- upstream openclaw with the IRC
    # channel plugin baked in. Not upstream's image: the plugin is an external
    # package that openclaw would otherwise have to fetch from npm at runtime.
    #
    # The tag is the upstream openclaw version the image is built on, and it is
    # the one place that version is written down -- `make image` reads both
    # fields back out of here to build and tag.
    repository: asi/openclaw
    tag: 2026.8.1
    # The image is side-loaded into k3d rather than pulled from a registry, so
    # Always would fail on a cluster that has it and no way to fetch it.
    pullPolicy: IfNotPresent

  # Where the image stages openclaw's managed plugin tree, with @openclaw/irc
  # already installed into it. The init container copies this over
  # ~/.openclaw/npm on the volume at boot: the plugin only loads as *trusted*
  # -- which the IRC channel requires -- from that managed root, and that root
  # is on the PVC, so the image cannot simply ship it in place.
  pluginStagePath: /opt/openclaw/npm

  # openclaw's plugin allowlist, and it is *exclusive*: a plugin not named
  # here does not load, however it got into the image. It has to cover much
  # more than the channel, because the model provider and the agent harness
  # runtime are plugins too -- and leaving those out fails at reply time
  # rather than at startup, with "Agent harness runtime <name> is unavailable
  # because its plugin registration is missing from this prepared run."
  #
  # These defaults track `provider` below: `openai` supplies the model and
  # `codex` is the harness that runs it. Point the provider somewhere else and
  # this list has to move with it -- `anthropic` for Claude models, and
  # whichever harness that provider's models run under.
  #
  # `diagnostics-otel` is the telemetry exporter (see `otel` below). Unlike
  # `irc` it is *bundled* in the image at /app/extensions, so it needs no
  # install and no staging onto the volume -- naming it here and enabling its
  # entry is the whole of it. Being bundled is load-bearing, not incidental:
  # the gateway hands a plugin the internal diagnostics bus only when its
  # origin is "bundled" (or it is a trusted official install), and that bus is
  # the exporter's only event source. An npm-installed copy loads, reports
  # enabled, and exports nothing at all.
  plugins:
    allow:
      - irc
      - openai
      - codex
      - diagnostics-otel

  provider:
    # Supplied, never generated: `make deploy` pipes this in from the
    # environment. Rotation leaves it alone, and leaving it empty on a redeploy
    # preserves whatever is already in the cluster rather than blanking it.
    apiKey: ""
    # Environment variable openclaw should read the key from.
    envVar: OPENAI_API_KEY

  # Agents are defined in `charts/asi/agents/<id>/`, one directory per agent,
  # and rendered into openclaw's `agents.entries` plus the top-level `bindings`
  # list. See charts/asi/agents/README.md for the layout.
  #
  # The directory name is the openclaw agent id, and a directory counts as an
  # agent only if it holds an `agent.yaml`. Its `*.md` files are the agent's
  # definition -- AGENTS.md, SOUL.md, IDENTITY.md, USER.md, BOOTSTRAP.md -- and
  # openclaw injects them into the system prompt, so they are the agent's
  # behaviour rather than documentation of it.
  #
  # They have to reach the workspace to be injected: openclaw offers no config
  # key for a prompt or for context files outside the workspace, so the init
  # container copies them in from a ConfigMap. Definition files are
  # chart-owned and replaced on every boot, on the same reasoning as
  # openclaw.json. Nothing else in the workspace is touched -- the agent's
  # actual working files are its own.
  agents:
    # Where a sole agent's workspace lives, and the parent of each agent's
    # subdirectory once there is more than one. Matches openclaw's own default.
    workspaceRoot: /home/node/.openclaw/workspace

    # Stops openclaw generating its own AGENTS.md / SOUL.md / IDENTITY.md /
    # USER.md / BOOTSTRAP.md, because the repo supplies them.
    #
    # The consequence is worth stating plainly: with this true, a definition
    # file the repo does not provide simply does not exist for that agent --
    # openclaw will not fill the gap. Set it false to have openclaw write any
    # bootstrap file the repo leaves out.
    skipBootstrap: true

    # Merged into openclaw's `agents.defaults`, under the workspace and
    # skipBootstrap values above. Per-agent settings belong in that agent's
    # `agent.yaml` instead; this is for what they all share -- `model`,
    # `skills`, `sandbox`, `contextInjection`, and so on.
    defaults: {}

  irc:
    nick: openclaw
    username: openclaw
    realname: ASI
    # No `tls` knob: the in-cluster hop to ergo is always plaintext, and the
    # plugin could not do TLS here even if asked. See openclaw-configmap.yaml.
    # Traffic stays on the pod network.

    # Channels to join.
    channels:
      - "#asi"
    dmPolicy: pairing
    groupPolicy: allowlist

    # The allowlist `groupPolicy: allowlist` actually consults. Joining a
    # channel does not imply listening to it: with no entry here openclaw sits
    # in the channel and drops every message with
    # `drop channel <name> (not allowlisted)`.
    #
    # A channel is allowed by *having an entry*, so `{}` is a complete and
    # valid one. The value is that channel's policy -- `requireMention`,
    # `tools`, `toolsBySender`, `skills`, `enabled`, `allowFrom`,
    # `systemPrompt`. The key `"*"` is a wildcard matching any channel.
    #
    # Empty means "an empty entry per channel joined above", which is the only
    # sane default for a bot whose whole job is those channels. Set it to act
    # on fewer channels than are joined, or to give one its own policy.
    #
    # This is deliberately not `groupAllowFrom`, which reads like the knob for
    # this and is not: the plugin consults it only to narrow `groupPolicy:
    # open`, and it gates nothing under `allowlist`.
    groups: {}

    # Merged into each entry `groups` derives from `channels`; ignored for a
    # channel spelled out in `groups` explicitly.
    groupDefaults:
      # Senders admitted once the channel itself is. Both gates are separate
      # and both drop silently-ish: an unlisted channel logs `drop channel
      # <name> (not allowlisted)`, an unlisted sender `drop group sender
      # <mask> (policy=allowlist)`.
      #
      # "*" is everyone on the network, which is defensible here rather than
      # lax: ergo gates the network itself behind the rotated shared PASS, so
      # "everyone" means "everyone already holding a rotated secret". Narrow
      # it with `nick!user` or `nick!user@host` entries -- a bare nick matches
      # only under `dangerouslyAllowNameMatching`, and ergo's cloaked hosts
      # change per connection, so `nick!user` is the stable form.
      allowFrom: ["*"]

      # Whether a channel message has to address the bot by nick before it
      # gets a reply. openclaw defaults this to true for groups, which drops
      # everything else as `drop channel <name> (missing-mention)`.
      #
      # False here because these channels are the bot's whole reason to exist
      # -- it is not a guest in someone else's room, so making every line an
      # @-mention is just friction. Set it true for a channel openclaw shares
      # with an ongoing human conversation it should stay out of.
      requireMention: false

  gateway:
    port: 18789
    bind: lan

  # OpenTelemetry export, via the bundled `diagnostics-otel` plugin. Covers the
  # two surfaces this deployment cares about:
  #
  #   openclaw.tool.execution  every tool call, including the ones plugins
  #                            provide -- `openclaw.tool.source` and
  #                            `openclaw.tool.owner` say which plugin
  #   openclaw.exec            every child process openclaw spawns, with
  #                            exit code, signal, timeout flag and
  #                            command *length* (never the command text)
  #
  # plus `openclaw.harness.run` (the agent harness, with
  # `openclaw.harness.plugin`), `openclaw.model.call`, `openclaw.run` and the
  # message-flow spans, which are what the two above hang off.
  #
  # There is deliberately no span filtering here or in the collector. An exec
  # span is only interesting next to the run that spawned it, and dropping the
  # parents would break exactly the correlation described below.
  otel:
    enabled: true

    # Where to send OTLP. Empty means the in-cluster collector this chart
    # deploys (see `otelCollector`); set it to reach a collector or backend
    # elsewhere. Only OTLP/HTTP protobuf is supported -- openclaw rejects
    # `grpc` outright -- so this is a base URL and openclaw appends
    # /v1/traces, /v1/metrics and /v1/logs itself.
    endpoint: ""

    # `service.name` on every exported span.
    serviceName: openclaw-gateway

    traces: true
    metrics: true
    # Logs are off because the pod already writes them to stdout, where the
    # cluster's log pipeline can have them; turning this on ships a second
    # copy over OTLP. Log *bodies* stay withheld either way unless
    # `captureContent` is set.
    logs: false

    # Root-span sampler, 0.0..1.0. Keep this at 1.0 unless volume becomes a
    # problem, and understand what lowering it drops: it samples *root* spans,
    # and an exec span becomes its own root whenever the exporter cannot
    # resolve the run span it belongs to (see below). Those orphans are the
    # ones you least want thinned.
    sampleRate: 1.0

    # Metric export interval. Floor is 1000ms; openclaw clamps below that.
    flushIntervalMs: 10000

    # Off, and worth leaving off. This is the switch that lets prompt text,
    # model responses, tool inputs and tool outputs onto the wire. Nothing
    # else exports content: spans otherwise carry only bounded identifiers,
    # and exec reports `command_length` rather than the command.
    captureContent: false

    # openclaw does not put a run id on exported spans, so **the trace id is
    # the run correlation key** -- group by it rather than filtering on an
    # attribute. This is not an oversight to work around: the exporter's
    # addRunAttrs() takes an event carrying `runId` and writes only provider,
    # model, channel and trigger, and `openclaw.run_id`/`openclaw.runId` are
    # additionally in a DROPPED_OTEL_ATTRIBUTE_KEYS denylist applied to every
    # span on its way out. Two independent layers, both deliberate.
    #
    # What you get instead is real parentage: tool and exec spans are children
    # of `openclaw.run` (or `openclaw.harness.run` for the openclaw harness)
    # and share its trace id, including children that settle after the parent
    # run has already ended.
    #
    # The one gap: when the exporter cannot resolve a parent it actually
    # exported, it leaves the span a root rather than naming a span no backend
    # will receive -- so that exec span lands on a trace of its own. It needs
    # the run to have started while the exporter was running, which here means
    # a config change rolls the pod and the next run is whole. A pod killed
    # mid-run can still orphan the exec spans already in flight.
    #
    # `agent` and `agent version` are likewise absent from tool and exec spans
    # (`openclaw.agent` reaches only skill spans and a few metrics), so they
    # are attached as *resource* attributes below, which lands them on every
    # span the process exports. Resource attributes describe the process, not
    # the run -- accurate here because this pod runs a single agent, and worth
    # remembering if that ever stops being true.
    resource:
      # `openclaw.agent`. openclaw's own name for the default agent is `main`.
      agent: main

      # `service.version`. Defaults to `openclaw.image.tag`, which is the
      # upstream openclaw version and the one place it is written down.
      version: ""

      # Merged in as-is. Keys are OTel resource attribute names, so
      # `deployment.environment: dev` rather than a camelCase invention.
      extra: {}

      # Fingerprints the agent's workspace so a span can be traced back to the
      # *contents* the agent was running with -- the AGENTS.md / SOUL.md /
      # IDENTITY.md / USER.md set that defines it. `service.version` above
      # identifies the openclaw build; this identifies what it was running.
      #
      # Three attributes, answering different questions:
      #
      #   openclaw.workspace.tree      git tree hash of the whole directory.
      #                                Pure content: identical contents give an
      #                                identical hash on any pod, and it covers
      #                                uncommitted and untracked files, which
      #                                here is *all* of them.
      #   openclaw.workspace.snapshot  commit hash in the provenance store
      #                                below, which is what actually recovers
      #                                the contents (`make provenance-show`).
      #   openclaw.workspace.git_head  the workspace repo's own HEAD, and
      #                                `openclaw.workspace.git_dirty` whether
      #                                it has uncommitted changes.
      #
      # Worth knowing before you rely on git_head: the workspace is a git repo
      # with **no commits and no remote** -- openclaw runs `git init` and then
      # never commits, so every file is untracked and `git rev-parse HEAD`
      # fails. git_head reports `none`, honestly, and the tree hash is doing
      # all of the work. That is why the snapshot store exists: nothing else
      # here can hand back the contents.
      #
      # These are computed by an init container at boot and merged into
      # OTEL_RESOURCE_ATTRIBUTES, so **they describe the workspace as the pod
      # started, not as it was when a given span fired**. openclaw generates
      # this content itself on first bootstrap rather than shipping it in the
      # image, and an agent can write there later; a change mid-life leaves the
      # attribute stale until the next restart. In practice the content is
      # written once at first bootstrap and then persists on the PVC untouched
      # across restarts, which is what makes a boot-time snapshot worth
      # anything at all. Per-span accuracy is not available: openclaw exposes
      # no per-run or pre-exec hook to recompute against, and the exporter puts
      # nothing workspace-shaped on a span.
      workspace:
        enabled: true

        # What to fingerprint. The agent workspace, not the whole of
        # ~/.openclaw: the state sqlite next door changes on every turn and is
        # large, so hashing it would make the fingerprint churn without
        # describing the agent any better.
        path: /home/node/.openclaw/workspace

        # A bare git repo on the PVC holding every distinct snapshot, as a
        # `provenance` branch with one commit per observed change. It is the
        # only thing that makes a hash *recoverable* rather than merely
        # identifying, and it is deliberately a separate store: snapshotting
        # writes nothing to the workspace's own .git, adds no commits to it,
        # and leaves its index alone.
        store: /var/lib/asi/provenance

  service:
    type: ClusterIP

  persistence:
    # Holds openclaw.json, the state sqlite db, and the agent workspace.
    size: 2Gi
    storageClass: ""

  resources: {}

  extraEnv: {}

# An OTLP sink for the telemetry `openclaw.otel` produces, so the chart is
# self-contained on a cluster that has no observability stack -- as k3d does
# not. It writes what it receives to its own stdout (`make logs-otel`), which
# is enough to read spans and confirm the pipeline, and is not a trace store:
# nothing is retained or queryable. Point `openclaw.otel.endpoint` at a real
# backend and set `enabled: false` here when you want history.
#
# A Deployment, not a StatefulSet: there is nothing to persist.
otelCollector:
  enabled: true

  image:
    repository: otel/opentelemetry-collector
    tag: 0.145.0
    # Pulled from Docker Hub normally, unlike the openclaw image -- there is
    # nothing local to side-load, so the k3d caveat does not apply here.
    pullPolicy: IfNotPresent

  # OTLP/HTTP only. openclaw speaks nothing else: `http/protobuf` is the only
  # protocol its config accepts, so a gRPC receiver on 4317 would take no
  # traffic and is left out rather than opened for nothing.
  otlpHttpPort: 4318

  # health_check, for the probes.
  healthCheckPort: 13133

  # `detailed` prints full spans with every attribute, which is the point of
  # running this at all -- it is how you see `openclaw.exec.exit_code` or
  # `openclaw.tool.owner` land. Drop to `normal` for one line per batch if the
  # logs get too loud.
  verbosity: detailed

  service:
    type: ClusterIP

  resources: {}
