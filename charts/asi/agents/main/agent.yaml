# The presence of this file is what makes `agents/main/` an agent, and the
# directory name is the openclaw agent id. The *.md files beside it are the
# agent's definition and get copied into its workspace at boot.

# Merged verbatim into openclaw's `agents.entries.main`, so anything openclaw
# accepts there is accepted here -- model, utilityModel, identity, skills,
# tools, sandbox, runtime, subagents, thinkingDefault, and the rest. Empty
# means "inherit every default", which is what this agent did before it was
# written down here.
#
#   entry:
#     identity:
#       name: ASI
#       emoji: "🦥"
#     model: openai/gpt-5.4
#     skills: []
#     tools:
#       profile: coding
#
# `workspace` is the one key not to set unless you mean it: the chart fills it
# in and the init container seeds the same path, so overriding it here moves
# both together but is easy to get half-right.
entry: {}

# Routing, as openclaw's top-level `bindings` entries with `agentId` filled in.
#
# Ignored while this is the only agent -- openclaw routes everything to a sole
# agent by fallback. It stops being optional the moment a second agent exists:
# an explicit fleet with no matching binding fails closed, so the chart refuses
# to render rather than let a new agent quietly stop the bot answering.
#
#   bindings:
#     - match:
#         channel: irc
#         peer:
#           kind: channel
#           id: "#asi"
bindings: []
