{{- if .Values.otelCollector.enabled }}
{{/*
Only the OTLP/HTTP receiver is configured. openclaw's config accepts
`http/protobuf` and nothing else -- `grpc` is retired and rejected outright --
so a 4317 listener would sit idle, and an open port that never takes traffic is
worse than no port.

The debug exporter is the whole sink: spans go to the collector's stdout and
`make logs-otel` reads them. Nothing is stored. Swap this pipeline for an
otlp/otlphttp exporter, or set openclaw.otel.endpoint and turn the collector
off, when the traces need to outlive the pod.

Two debug exporters, not one, and the reason is the difference between the two
signals. Metrics arrive every `flushIntervalMs` whether or not anything
happened; spans arrive only when an agent does something. At `detailed` one
metrics batch is around 3000 lines, so ten seconds of idle telemetry evicts
every span from the container log -- the retained window collapsed to about
three minutes, and `make traces` reliably found nothing while the collector
was in fact receiving and printing spans perfectly well. Metrics therefore
get their own terse exporter, and spans keep the detail that is the entire
point of running this.

No span filtering, deliberately. Tool and exec spans are children of the run
spans and carry no run id of their own, so the trace is the only thing tying a
child to the run that spawned it -- dropping the parents to "only keep exec"
would leave orphans with nothing to correlate against.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "asi.collector.fullname" . }}
  labels:
    {{- include "asi.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:{{ .Values.otelCollector.otlpHttpPort }}

    processors:
      batch: {}

    exporters:
      # Spans and logs: the detail is the point.
      debug:
        verbosity: {{ .Values.otelCollector.verbosity }}
      # Metrics: one summary line per batch, so they cannot bury the spans.
      debug/metrics:
        verbosity: {{ .Values.otelCollector.metricsVerbosity }}

    extensions:
      health_check:
        endpoint: 0.0.0.0:{{ .Values.otelCollector.healthCheckPort }}

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug/metrics]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
{{- end }}
