{{- include "asi.secrets" . -}}
{{- $secrets := .Values.resolvedSecrets -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "asi.secretName" . }}
  labels:
    {{- include "asi.labels" . | nindent 4 }}
  annotations:
    # The credentials outlive the release: an accidental `helm uninstall`
    # should not take the only copy of them with it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Generation the values below were derived at. `asi.secrets` compares this
  # against secrets.generation to decide preserve-vs-regenerate.
  generation: {{ index $secrets "generation" | quote }}

  # Shared: the IRC PASS. ergo bcrypts it into ERGO__SERVER__PASSWORD at pod
  # startup, openclaw sends the plaintext. Rotating it rolls both.
  irc-server-password: {{ index $secrets "irc-server-password" | quote }}

  # ergo only: /OPER admin <password>.
  irc-oper-password: {{ index $secrets "irc-oper-password" | quote }}

  # openclaw only: authenticates against the gateway control UI and API.
  openclaw-gateway-token: {{ index $secrets "openclaw-gateway-token" | quote }}

  # Supplied, not generated -- see `asi.secrets`.
  provider-api-key: {{ index $secrets "provider-api-key" | quote }}
