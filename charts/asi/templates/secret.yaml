{{- include "asi.secrets" . -}}
{{- $secrets := .Values.resolvedSecrets -}}
{{/*
Every credential, in one Secret. Which keys exist is derived from the fleet
rather than listed here, so an A2A edge added in values.yaml mints its bearers
without a second edit -- see asi.secretLengths. The families:

  irc-server-password              shared: ergo bcrypts it into
                                   ERGO__SERVER__PASSWORD at pod startup,
                                   every gateway that joins sends the
                                   plaintext. Rotating it rolls all of them.
  irc-oper-password                ergo only: /OPER admin <password>.
  openclaw-gateway-token-<gateway> one per gateway. Authenticates against that
                                   gateway's control UI and API, and nothing
                                   else -- the A2A routes register with
                                   `auth: "plugin"`, so this is not involved
                                   in traffic between gateways.
  a2a-token-<target>-from-<caller> the bearer <caller> presents when it
                                   addresses <target>. Both directions of
                                   every declared edge exist, because
                                   openclaw's peer schema requires `token`
                                   even on a peer that is only ever called.
  provider-api-key                 supplied, not generated -- see asi.secrets.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "asi.secretName" . }}
  labels:
    {{- include "asi.labels" . | nindent 4 }}
  annotations:
    # The credentials outlive the release: an accidental `helm uninstall`
    # should not take the only copy of them with it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- /*
  `generation` is the generation the values below were derived at;
  `asi.secrets` compares it against secrets.generation to decide
  preserve-vs-regenerate. It is in the same map as the credentials, so it is
  written by the same loop.
  */}}
  {{- range $key, $value := $secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
