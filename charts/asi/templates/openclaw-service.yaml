{{/*
One Service per gateway. This is what makes an A2A peer URL a stable name:
`channels.a2a.advertisedUrl` on the callee and `peers.<name>.url` on the caller
are both built from it, so the two cannot drift.

The selector needs `asi.dev/gateway` as well as the component label -- every
gateway pod carries `component: openclaw`, so the component alone would make
each Service a random-per-connection load balancer across the whole fleet.
That is precisely the broken case caller-side variant selection exists to
avoid: sessions for a (peer, contextId) live in one pod's sqlite on its own
PVC, so a context that lands on a different variant loses its history.
*/}}
{{- include "asi.gateways" . -}}
{{- range $key, $gw := .Values.resolvedGateways }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $gw.fullname }}
  labels:
    {{- include "asi.labels" $ | nindent 4 }}
    app.kubernetes.io/component: openclaw
    asi.dev/gateway: {{ $key }}
spec:
  type: {{ $.Values.openclaw.service.type }}
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: openclaw
    asi.dev/gateway: {{ $key }}
  ports:
    - name: gateway
      port: {{ $.Values.openclaw.gateway.port }}
      targetPort: gateway
{{- end }}
