{{- if .Values.otelCollector.enabled }}
{{- $name := include "asi.collector.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "asi.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        {{- include "asi.labels" . | nindent 8 }}
        app.kubernetes.io/component: otel-collector
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/otel-collector-configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        # `otel` in upstream's image, which runs unprivileged already.
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: otel-collector
          image: "{{ .Values.otelCollector.image.repository }}:{{ .Values.otelCollector.image.tag }}"
          imagePullPolicy: {{ .Values.otelCollector.image.pullPolicy }}
          # Upstream's entrypoint reads /etc/otelcol/config.yaml, which is not
          # where this is mounted, so the path is passed explicitly.
          args: ["--config=/conf/config.yaml"]
          ports:
            - name: otlp-http
              containerPort: {{ .Values.otelCollector.otlpHttpPort }}
            - name: health
              containerPort: {{ .Values.otelCollector.healthCheckPort }}
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            {{- toYaml .Values.otelCollector.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
            items:
              - key: config.yaml
                path: config.yaml
{{- end }}
