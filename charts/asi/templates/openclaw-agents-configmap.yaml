{{/*
The agent definition files, kept out of the gateway ConfigMap because they are
prompt content rather than configuration and because a persona edit should
roll the pod on its own checksum.

One ConfigMap per gateway, so that checksum is *scoped*: editing a poet's
persona rolls that poet and leaves `main` -- and the other variant, and the
contexts already pinned to it -- alone. The single shared ConfigMap of the
old layout rolled everything.

Keys cannot contain "/", so each is `<agent id>--<filename>` and the volume's
`items` maps it back to `<agent id>/<filename>` at mount time. render.sh reads
the nested form. The gateway is not in the key, because it is now in the
object's name.

Named-template body for the same reason as the gateway ConfigMap: the
StatefulSet hashes these exact bytes.
*/}}
{{- define "asi.gateway.agentsConfigmapData" -}}
{{- $root := .root -}}
{{- $gw := .gw -}}
{{- range $agentId := $gw.agentIds }}
{{- range $path := index $gw.files $agentId }}
{{ include "asi.agents.key" (dict "path" $path) }}: |
  {{- $root.Files.Get $path | nindent 2 }}
{{- end }}
{{- end }}
{{- end -}}

{{- include "asi.gateways" . -}}
{{- range $key, $gw := .Values.resolvedGateways }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $gw.fullname }}-agents
  labels:
    {{- include "asi.labels" $ | nindent 4 }}
    app.kubernetes.io/component: openclaw
    asi.dev/gateway: {{ $key }}
data:
  {{- include "asi.gateway.agentsConfigmapData" (dict "root" $ "gw" $gw) | nindent 2 }}
{{- end }}
